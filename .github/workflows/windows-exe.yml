# Builds the Windows package (CreativeAutomationPipeline-windows.zip) on
# GitHub's Windows runner, so it can be made from a Mac. Runs on every
# push to main and by hand from the Actions tab; the zip is attached to
# the run as an artifact. Pushing a tag like v1.0 also publishes it on a
# GitHub Release, which gives it a permanent download link.
name: Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt pyinstaller

      - name: Build
        shell: pwsh
        run: .\windows\build_exe.ps1

      - name: Smoke test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\CreativeAutomationPipeline\CreativeAutomationPipeline.exe" -PassThru -RedirectStandardOutput exe.log -RedirectStandardError exe.err
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest -UseBasicParsing -Uri http://127.0.0.1:5000/ -TimeoutSec 2; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Content exe.log, exe.err -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Host "the exe never answered on port 5000" -ForegroundColor Red; exit 1 }

      - uses: actions/upload-artifact@v5
        with:
          name: CreativeAutomationPipeline-windows
          path: dist/CreativeAutomationPipeline-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/CreativeAutomationPipeline-windows.zip
