# Builds the Windows package (CreativeAutomationPipeline-windows.zip) on
# GitHub's Windows runner, so it can be made from a Mac. Runs on every
# push to main and by hand from the Actions tab; the zip is attached to
# the run as an artifact. Pushing a tag like v1.0 also publishes it on a
# GitHub Release, which gives it a permanent download link.
name: Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt pyinstaller

      # static/tailwind-*.css is committed, so the app runs from source
      # without Node. Rebuilding it here anyway means a release can never
      # ship a stale stylesheet because someone edited styles/*.css and
      # forgot `npm run css`.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Rebuild the stylesheet
        run: |
          npm ci
          npm run css

      # Say so loudly rather than quietly shipping the rebuilt file: the
      # committed copy is what a source run and the .dmg use, so if it
      # differs here it is stale in those too.
      - name: Warn if the committed stylesheet was stale
        shell: pwsh
        run: |
          $changed = git status --porcelain static
          if ($changed) {
            Write-Host "::warning::static/tailwind-*.css was out of date with styles/*.css -- this build used a freshly compiled copy. Run 'npm run css' and commit the result so source runs and the .dmg match."
            Write-Host $changed
          } else {
            Write-Host "committed stylesheet is up to date"
          }

      # run.ps1 and install.ps1 are edited from a Mac, where nothing can
      # parse them. The Windows runner can, so a syntax error surfaces here
      # rather than on a user's machine.
      - name: Check the PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = $false
          foreach ($f in @("run.ps1", "install.ps1", "windows/build_exe.ps1")) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { Write-Host "::error::$f does not parse"; $errs | ForEach-Object { Write-Host "  $_" }; $bad = $true }
          }
          if ($bad) { exit 1 }
          Write-Host "PowerShell scripts parse"

      - name: Build
        shell: pwsh
        run: .\windows\build_exe.ps1

      - name: Smoke test the exe
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\CreativeAutomationPipeline\CreativeAutomationPipeline.exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru -RedirectStandardOutput "$PWD\exe.log" -RedirectStandardError "$PWD\exe.err"
          $ok = $false
          $url = "http://127.0.0.1:5000/"
          # A cold runner takes a while to page in OpenCV and scikit-image;
          # and the app moves off 5000 if something else holds it, so read
          # the address it prints rather than assuming.
          for ($i = 0; $i -lt 180; $i++) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { Write-Host "the exe exited early with code $($p.ExitCode)" -ForegroundColor Red; break }
            $log = Get-Content exe.log -Raw -ErrorAction SilentlyContinue
            if ($log -match "http://127\.0\.0\.1:(\d+)") { $url = "http://127.0.0.1:$($Matches[1])/" }
            try { $r = Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 60; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "---- exe.log ----"; Get-Content exe.log -ErrorAction SilentlyContinue
          Write-Host "---- exe.err ----"; Get-Content exe.err -ErrorAction SilentlyContinue
          if ($ok) { Write-Host "the exe answered on $url after $i s" -ForegroundColor Green }
          else { Write-Host "the exe never answered (last tried $url)" -ForegroundColor Red; exit 1 }

      - uses: actions/upload-artifact@v6
        with:
          name: CreativeAutomationPipeline-windows
          path: dist/CreativeAutomationPipeline-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/CreativeAutomationPipeline-windows.zip
