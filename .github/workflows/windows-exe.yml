# Builds both downloads: the Windows package
# (CreativeAutomationPipeline-windows.zip) on GitHub's Windows runner, so
# it can be made from a Mac, and CreativeAutomationPipeline.dmg on a macOS
# runner. Runs on every push to main and by hand from the Actions tab;
# each build is attached to the run as an artifact. Pushing a tag like
# v1.0 also publishes both on a GitHub Release, which gives them permanent
# download links.
#
# The dmg used to be built by hand and dragged onto the release. Two
# hand-built images from different days ended up in circulation, and
# opening the older one silently overwrote a newer install -- twice in one
# evening. One image per release, built from the tagged commit, is the
# fix.
name: Windows exe and macOS dmg

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt pyinstaller

      # static/tailwind-*.css is committed, so the app runs from source
      # without Node. Rebuilding it here anyway means a release can never
      # ship a stale stylesheet because someone edited styles/*.css and
      # forgot `npm run css`.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # Rebuilt only to compare. This build ships the COMMITTED stylesheet
      # -- and so does the .dmg, and so does every run from source. Quietly
      # shipping a freshly compiled one here meant the exe could be styled
      # from different bytes than everything else, which is precisely the
      # difference nobody can see in a screenshot. A stale committed copy
      # is now a failed build, not a warning nobody reads.
      - name: The committed stylesheet must be in step with styles/
        shell: pwsh
        run: |
          npm ci
          npm run css
          $changed = git status --porcelain static
          if ($changed) {
            Write-Host $changed
            Write-Host "::error::static/tailwind-*.css is out of date with styles/*.css. The .dmg and every source run serve the committed copy, so a stale one means the two builds do not look alike. Run 'npm run css' and commit the result."
            exit 1
          }
          git checkout -- static
          Write-Host "committed stylesheet is in step with styles/"

      # run.ps1 and install.ps1 are edited from a Mac, where nothing can
      # parse them. The Windows runner can, so a syntax error surfaces here
      # rather than on a user's machine.
      - name: Check the PowerShell scripts parse
        shell: pwsh
        run: |
          $bad = $false
          foreach ($f in @("run.ps1", "install.ps1", "windows/build_exe.ps1")) {
            $errs = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { Write-Host "::error::$f does not parse"; $errs | ForEach-Object { Write-Host "  $_" }; $bad = $true }
          }
          if ($bad) { exit 1 }
          Write-Host "PowerShell scripts parse"

      - name: Build
        shell: pwsh
        run: .\windows\build_exe.ps1

      - name: Smoke test the exe
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\CreativeAutomationPipeline\CreativeAutomationPipeline.exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru -RedirectStandardOutput "$PWD\exe.log" -RedirectStandardError "$PWD\exe.err"
          $ok = $false
          $url = "http://127.0.0.1:5000/"
          # A cold runner takes a while to page in OpenCV and scikit-image;
          # and the app moves off 5000 if something else holds it, so read
          # the address it prints rather than assuming.
          for ($i = 0; $i -lt 180; $i++) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { Write-Host "the exe exited early with code $($p.ExitCode)" -ForegroundColor Red; break }
            $log = Get-Content exe.log -Raw -ErrorAction SilentlyContinue
            if ($log -match "http://127\.0\.0\.1:(\d+)") { $url = "http://127.0.0.1:$($Matches[1])/" }
            try { $r = Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 60; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { }
          }
          if ($ok) { $r.Content | Set-Content -Path "$PWD\served-exe.html" -Encoding UTF8 }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Write-Host "---- exe.log ----"; Get-Content exe.log -ErrorAction SilentlyContinue
          Write-Host "---- exe.err ----"; Get-Content exe.err -ErrorAction SilentlyContinue
          if ($ok) { Write-Host "the exe answered on $url after $i s" -ForegroundColor Green }
          else { Write-Host "the exe never answered (last tried $url)" -ForegroundColor Red; exit 1 }

      # "Does the .exe look like the .dmg?" as a build step instead of a
      # screenshot. Same runner, same Python, same commit, so PyInstaller is
      # the only variable -- and a bundle that lost templates/ or static/
      # still answers 200, it just answers with a different page. That is
      # what the smoke test above cannot see and this can.
      - name: The packaged app must serve the same page as the source
        shell: pwsh
        run: |
          $env:FLASK_RELOAD = "0"
          $src = Start-Process -FilePath "python" -ArgumentList "webapp.py" -PassThru -RedirectStandardOutput "$PWD\src.log" -RedirectStandardError "$PWD\src.err"
          $ok = $false
          $url = "http://127.0.0.1:5000/"
          for ($i = 0; $i -lt 180; $i++) {
            Start-Sleep -Seconds 1
            if ($src.HasExited) { Write-Host "the source run exited early with code $($src.ExitCode)" -ForegroundColor Red; break }
            $log = Get-Content src.log -Raw -ErrorAction SilentlyContinue
            if ($log -match "http://127\.0\.0\.1:(\d+)") { $url = "http://127.0.0.1:$($Matches[1])/" }
            try { $r = Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 60; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { }
          }
          if ($ok) { $r.Content | Set-Content -Path "$PWD\served-source.html" -Encoding UTF8 }
          Stop-Process -Id $src.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Host "---- src.err ----"; Get-Content src.err -ErrorAction SilentlyContinue; exit 1 }
          python scripts/compare_served.py served-exe.html served-source.html

      - uses: actions/upload-artifact@v6
        with:
          name: CreativeAutomationPipeline-windows
          path: dist/CreativeAutomationPipeline-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/CreativeAutomationPipeline-windows.zip

  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # make_dmg.sh stages the working tree with `git ls-files`, so a plain
      # checkout is all it needs. Node matters only when styles/ is ahead of
      # the committed stylesheet -- ensure_css warns and carries on rather
      # than failing, but with Node here it just rebuilds.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build the disk image
        run: ./macos/make_dmg.sh

      # The launcher inside the image copies its code over an existing
      # install. An image built without the guard downgrades whoever opens
      # it, without asking, and the only symptom is the app behaving as
      # though a week of fixes were undone. It has happened; it is worth
      # one grep before the image is published.
      - name: Check the image asks before installing over a newer copy
        run: |
          set -euo pipefail
          MOUNT="$(mktemp -d)"
          hdiutil attach CreativeAutomationPipeline.dmg -mountpoint "$MOUNT" -nobrowse -quiet
          APP="$MOUNT/Creative Automation Pipeline.app"
          grep -q image_is_older_than_install "$APP/Contents/MacOS/start"
          test -f "$APP/Contents/Resources/install_guard.sh"
          hdiutil detach "$MOUNT" -quiet
          echo "the image carries the downgrade guard"

      - uses: actions/upload-artifact@v6
        with:
          name: CreativeAutomationPipeline-dmg
          path: CreativeAutomationPipeline.dmg

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: CreativeAutomationPipeline.dmg
